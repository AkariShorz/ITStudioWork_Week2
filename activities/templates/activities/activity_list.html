<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>社团活动</title>
</head>
<body>
    <h1>社团活动</h1>

    <form method="get">
        <label for="q">按标题搜索：</label>
        <input id="q" type="search" name="q" value="{{ keyword }}">
        <button type="submit">搜索</button>
        {% if keyword %}
            <a href="{% url 'activities:list' %}">清除搜索</a>
        {% endif %}
    </form>

    {% for activity in activities %}
        <article>
            <h2>{{ activity.title }}</h2>
            <p>{{ activity.start_time }} · {{ activity.location }}</p>
            <a href="{% url 'activities:edit' activity.pk %}">编辑</a>
            <a href="{% url 'activities:delete' activity.pk %}">删除</a>
        </article>
    {% empty %}
        <p>暂时没有活动。</p>
    {% endfor %}
</body>
</html>
