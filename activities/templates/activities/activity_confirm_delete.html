<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>删除活动</title>
</head>
<body>
    <h1>确认删除活动</h1>
    <p>确定要删除“{{ activity.title }}”吗？此操作无法撤销。</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">确认删除</button>
    </form>

    <a href="{% url 'activities:list' %}">取消，返回列表</a>
</body>
</html>
